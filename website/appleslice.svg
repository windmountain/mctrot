<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Apple slice</title>
  <defs>
    <!-- Peel outline: intersection of two large, equal circles -->
    <clipPath id="peel-clip">
      <circle cx="70" cy="100" r="85"/>
    </clipPath>
    <!-- Flesh outline: intersection of two smaller, equal circles, same center -->
    <clipPath id="flesh-clip">
      <circle cx="76" cy="100" r="68"/>
    </clipPath>
  </defs>

  <!-- Peel: circle B clipped by circle A -> lens shape -->
  <circle cx="130" cy="100" r="85" fill="#C6392B" clip-path="url(#peel-clip)"/>

  <!-- Flesh: smaller circle B' clipped by circle A' -> smaller lens, centered on the peel,
       leaving a uniform peel border that tapers to nothing at the two tips -->
  <circle cx="124" cy="100" r="68" fill="#F7EFD2" clip-path="url(#flesh-clip)"/>
</svg>
