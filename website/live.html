<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- /live between attempts: nothing live, just where McTrot 5's replay
       is. During an attempt this was the live page, now the replay at
       /archive/2026-11-21 (website/archive/2026-11-21/index.html). Netlify
       serves this for /live/map and the rest too (website/_redirects), so
       old links land here. No JavaScript. -->

  <meta name="description" content="Nothing is live right now. McTrot 5, November 21, 2026, can be replayed.">

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="McTrot">

  <!-- Absolute paths: this page is also served at /live/map and the rest. -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* As the live page looked (website/archive/2026-11-21/index.html):
       white, the title at the top left, one paragraph in the middle. */
    :root, :root[data-theme="dark"], :root[data-theme="light"] { --bg: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #fff; } }
    body { background: var(--paper); }
    .live-header { padding: var(--space-3) var(--space-4) var(--space-2); }
    .live-title { margin: 0; font: var(--t-display); letter-spacing: -0.02em; color: var(--ink); }
    .live-title a { color: inherit; text-decoration: none; }
    .live { max-width: var(--measure); margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-6); }
    .live p { margin: 0 0 var(--space-4); font: var(--t-body); color: var(--ink); }
    .live a { color: inherit; }
  </style>
</head>
<body>
  <header class="live-header">
    <p class="live-title"><a href="/">McTROT</a></p>
  </header>
  <main class="live">
    <p>Nothing is live right now. McTrot 5 was on November 21, 2026: you can <a href="/archive/2026-11-21">replay the whole day</a>, with the map, the posts, the timeline and the radio as they were at any moment.</p>
    <p>If you&rsquo;d like to attempt your own McTrot and have a live-updating page here, email <a href="mailto:admin@mctrot.nyc">admin@mctrot.nyc</a>.</p>
  </main>
</body>
</html>
