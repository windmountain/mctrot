<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>McTrot Live</title>
  <meta name="description" content="Where I am during a McTrot attempt, live.">
  <!-- Unlinked until launch: keep it out of search results. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#FFD100">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mctrot-map.css">
  <style>
    .live { max-width: var(--measure); margin: 0 auto; padding: 1rem 16px 2rem; }
    .live-home { margin: 0; }
    .live h1 { margin: 0.25rem 0 0; }
    .live-status { margin: 0.25rem 0 0; min-height: 1.6em; }
    .live-visits { margin: 0 0 1rem; min-height: 1.6em; }
    /* The radio (src/Radio.elm): top right; pinned there on a wide screen. */
    .radio { position: absolute; top: 12px; right: 16px; z-index: 2; font-size: 0.85em; max-width: calc(100vw - 32px); }
    .radio-bar { display: flex; align-items: center; gap: 8px; background: #111; color: #fff; border-radius: 999px; padding: 4px 6px 4px 4px; }
    .radio button { font: inherit; border: 0; cursor: pointer; }
    .radio-play { width: 2rem; height: 2rem; border-radius: 50%; background: #FFD100; color: #111; font-size: 0.85rem; line-height: 1; }
    .radio-info { display: flex; flex-direction: column; line-height: 1.15; min-width: 4.5rem; max-width: 11rem; }
    .radio-name { font-weight: bold; }
    .radio-status { opacity: 0.8; font-size: 0.9em; overflow-wrap: anywhere; }
    .radio-bar .radio-problem { color: #ffb3a7; opacity: 1; }
    .radio-volume { width: 5rem; accent-color: #FFD100; }
    .radio-station-button { background: none; color: #fff; text-decoration: underline; padding: 4px 6px; }
    .radio button:focus-visible, .radio input:focus-visible { outline: 2px solid #FFD100; outline-offset: 2px; }
    .radio-station { position: absolute; right: 0; top: calc(100% + 6px); width: min(20rem, calc(100vw - 32px)); background: #fff; color: #111;
      border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15); }
    .radio-station label { display: block; font-weight: bold; margin-bottom: 4px; }
    .radio-station input { box-sizing: border-box; width: 100%; font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; }
    .radio-station .radio-problem { color: #b42318; margin: 6px 0 0; }
    .radio-hint { margin: 8px 0; opacity: 0.75; font-size: 0.95em; }
    .radio-station-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .radio-station-actions button { background: #eee; padding: 6px 10px; border-radius: 6px; }
    .radio-station-actions button[type=submit] { background: #111; color: #fff; }
    @media (min-width: 64rem) { .radio { position: fixed; } }
    .live-weather { margin: 0 0 1rem; }
    .live-weather-when { opacity: 0.7; }
    /* The sky tiles (src/Live.elm, viewSky): a row of five on a phone; on
       a wide screen, a column pinned to the bottom-left corner. */
    .live-sky { margin: 0 0 1rem; }
    .live-sky ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
    .live-sky li { font-size: 0.75em; line-height: 1.25; text-align: center; }
    .live-sky-swatch { display: block; aspect-ratio: 1; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); margin-bottom: 0.25rem; }
    @media (min-width: 64rem) {
      .live-sky { position: fixed; left: 16px; bottom: 16px; width: 3.5rem; margin: 0; z-index: 1; }
      .live-sky ul { grid-template-columns: 1fr; }
    }
    .live-sun { margin: 1rem auto 0; border-collapse: collapse; font-size: 0.9em; }
    .live-sun caption { text-align: left; font-weight: bold; padding-bottom: 0.25rem; }
    .live-sun th, .live-sun td { text-align: left; padding: 0.15rem 0.75rem 0.15rem 0; font-variant-numeric: tabular-nums; }
    .live-sun thead th { font-weight: normal; opacity: 0.7; }
    .live-sun tbody th { font-weight: normal; }
    .live-map-svg { display: block; width: 100%; max-width: 320px; height: auto; margin: 0 auto; }
    .live-store { fill: #FF0000; }
    .live-store-visited { fill: #FFD100; }
    /* The path walked: under the stores, so they stay visible on it. */
    .live-track { fill: none; stroke: #FFD100; stroke-opacity: 0.85; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-me { fill: #fff; stroke: #FFD100; stroke-width: 3px; vector-effect: non-scaling-stroke; }
    .live-note { text-align: center; }
    .live-posts { list-style: none; padding: 0; margin: 1.5rem auto 0; max-width: 28rem; }
    .live-post { border-top: 1px solid var(--rule); padding: 0.6rem 0; }
    .live-post-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .live-post-when { margin: 0.2rem 0 0; font-size: 0.85em; opacity: 0.7; }
    /* body is a flex column (css/style.css), and a flex item won't shrink
       below its content's natural width: a 720 px video would widen the
       page past the screen. */
    main { min-width: 0; }
    .live-post-photo img, .live-post-video { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #000; border-radius: 6px; }
    .live-post-voice { width: 100%; }
    /* A DoubleTake pair: on a wide screen, both cameras side by side,
       wider than the feed (js/pair-player.js). */
    @media (min-width: 48rem) {
      .live-post-pair { position: relative; left: 50%; width: min(44rem, calc(100vw - 32px)); transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <main id="main">
    <div id="live">
      <noscript>
        <p><a href="/">McTrot</a></p>
        <h1>Live</h1>
        <p>This page shows where I am during a McTrot attempt. It requires JavaScript.</p>
      </noscript>
    </div>
  </main>

  <script src="js/pair-player.js"></script>
  <script src="js/live.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    // ?api=http://localhost:3000 points the page at a local recorder.
    var api = params.get("api");

    // --- The radio (src/Radio.elm draws it; this plays it) ---------------
    // The station: ?radio=<url>, or what this browser saved, or McTrot's.
    var RADIO_DEFAULT = "https://radio.mctrot.nyc/live.mp3";
    var RADIO_KEY = "mctrot-radio-url";
    var savedRadio = null;
    try { savedRadio = localStorage.getItem(RADIO_KEY); } catch (e) {}
    var radioParam = params.get("radio");
    var audio = new Audio();
    audio.preload = "none";
    // iPhones and iPads ignore a page setting the volume.
    audio.volume = 0.5;
    var volumeAdjustable = audio.volume === 0.5;
    audio.volume = 1;

    var app = Elm.Live.init({
      node: document.getElementById("live"),
      flags: {
        api: /^https?:\/\//.test(api || "") ? api.replace(/\/+$/, "") : "https://api.mctrot.nyc",
        radio: {
          url: /^https?:\/\//.test(radioParam || "") ? radioParam : savedRadio || RADIO_DEFAULT,
          defaultUrl: RADIO_DEFAULT,
          volumeAdjustable: volumeAdjustable
        }
      }
    });

    var send = function (event) { app.ports.radioIn.send(event); };
    var stopping = false;
    // Browsers give the same error for a stream they can't reach and one
    // they can't play, so a failed start asks the address directly: no
    // answer at all means unreachable. (The answer itself can't be read
    // from another site, but that it came is enough.)
    var problem = function (url) {
      var e = audio.error;
      if (e && e.code === 3) return Promise.resolve("The stream broke off.");
      var stop = new AbortController();
      setTimeout(function () { stop.abort(); }, 8000);
      return fetch(url, { mode: "no-cors", signal: stop.signal })
        .then(function () { stop.abort(); return "That isn’t audio this browser can play (a playlist?)."; })
        .catch(function () { return "Can’t reach the stream."; });
    };
    var fail = function () {
      var url = audio.getAttribute("src");
      if (!url) return;
      problem(url).then(function (message) {
        // Only if that's still the station playing.
        if (!stopping && audio.getAttribute("src") === url) send({ event: "error", message: message });
      });
    };
    audio.addEventListener("playing", function () { send({ event: "playing" }); });
    audio.addEventListener("waiting", function () { send({ event: "waiting" }); });
    audio.addEventListener("pause", function () { if (!stopping) send({ event: "paused" }); });
    audio.addEventListener("ended", function () { send({ event: "ended" }); });
    audio.addEventListener("error", function () { if (!stopping) fail(); });
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Radio", artist: "McTrot" });
    }

    app.ports.radioOut.subscribe(function (cmd) {
      if (cmd.command === "play") {
        stopping = false;
        audio.src = cmd.url;
        audio.volume = cmd.volume;
        audio.play().catch(function (err) {
          if (err.name === "NotAllowedError") send({ event: "error", message: "The browser wants a tap on ▶ first." });
          else if (err.name !== "AbortError" && !audio.error) fail();
        });
      } else if (cmd.command === "stop") {
        // Drop the connection, so playing again joins the stream live
        // rather than resuming from a buffer.
        stopping = true;
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
      } else if (cmd.command === "volume") {
        audio.volume = cmd.volume;
      } else if (cmd.command === "save") {
        try {
          if (cmd.url === null) localStorage.removeItem(RADIO_KEY);
          else localStorage.setItem(RADIO_KEY, cmd.url);
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
