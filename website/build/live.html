  <!-- Absolute paths: this page is also served at /live/map and the rest. -->
  <link rel="stylesheet" href="/css/style.css?v=f4a985b6e2">
  <style>
    /* /live is white, not the site's yellow: the page behind everything (and Safari's overscroll and toolbar,
       with theme-color above), the header and the tabs. Every theme of style.css's --bg, overridden. */
    :root, :root[data-theme="dark"], :root[data-theme="light"] { --bg: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #fff; } }
    /* The shell, the same on every view (src/Live.elm): header with the
       title and the radio, the view switcher, the view. */
    .app { flex: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    /* Stays put while the overview and the blog scroll (the other views
       fit the screen anyway); the radio's Links panel opens over the page. */
    .app-top { position: sticky; top: 0; z-index: 5; background: var(--bg); box-shadow: 0 1px 0 var(--rule); }
    .app-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px 10px; }
    .app-title h1 { margin: 0; font-size: clamp(1.75rem, 7vw, 2.5rem); line-height: 1; letter-spacing: -0.02em; color: var(--ink-1); }
    .app-title h1 a { text-decoration: none; }
    .app-subtitle { margin: 4px 0 0; font-size: 0.7rem; line-height: 1.3; font-weight: bold; letter-spacing: 0.08em; color: var(--ink-1); }
    .app-tabs { background: var(--bg); padding: 0 16px 12px; }
    .app-tabs ul { list-style: none; margin: 0 auto; padding: 0; display: flex; max-width: 30rem; border: 2px solid var(--ink-1); border-radius: 999px; overflow: hidden; }
    .app-tabs li { flex: 1; }
    .app-tabs li + li a { border-left: 2px solid var(--ink-1); }
    .app-tabs a { display: block; text-align: center; padding: 6px 4px; font-weight: bold; font-size: 0.9rem; text-decoration: none; color: var(--ink-1); }
    .app-tabs a[aria-current="page"] { background: var(--ink-1); color: var(--bg); }
    .app-tabs a:focus-visible { outline-offset: -4px; }
    .app-main { flex: 1; min-height: 0; }
    /* Map, timeline and stats take exactly the screen; the overview and
       the blog scroll like a page. */
    /* (flex: none: in the body's flex column, flex: 1 would override the
       height and let the view grow with its content.) */
    .page-map, .page-timeline, .page-stats { flex: none; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    .tab-empty { padding: 1rem 16px; text-align: center; }

    /* Map */
    .tab-map { display: flex; flex-direction: column; padding: 8px 16px; }
    .tab-map .live-status { text-align: center; margin: 0 0 4px; min-height: 0; }
    .tab-map .live-map { flex: 1; min-height: 0; }
    /* Pinching or double-tapping the map mustn't zoom the page (a finger still scrolls it): the map has its own zoom. */
    .tab-map .live-map { position: relative; touch-action: pan-x pan-y; }
    .tab-map .live-map-frame { height: 100%; max-width: none; overflow: auto; overscroll-behavior: contain; }
    .live-map-draggable { cursor: grab; user-select: none; -webkit-user-select: none; }
    .live-map-dragging { cursor: grabbing; }
    /* Top right, clear of the map's scrollbar. */
    .live-map-zoom { position: absolute; top: 8px; right: 24px; z-index: 1; display: flex; flex-direction: column; gap: 4px; }
    .live-map-zoom button { width: 32px; height: 32px; padding: 0; border: 2px solid #000; border-radius: 0; background: #fff; color: #000;
      font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
    .live-map-zoom button:disabled { color: #aaa; border-color: #aaa; cursor: default; }

    /* Blog */
    .tab-blog .live-posts { margin: 1rem auto 2rem; padding: 0 16px; }

    /* Timeline: oldest to newest, left to right */
    /* Timeline: the burndown chart (src/Burndown.elm), filling the screen. A summary and key on top, then a grid
       of the numbers down the left, and the time ruler over the plot. */
    .tab-timeline { display: flex; padding: 12px 16px 16px; }
    .burndown { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto minmax(0, 1fr); column-gap: 8px; }
    .burndown-summary { grid-column: 1 / -1; margin: 0 0 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
    .burndown-key { display: flex; gap: 16px; font-size: 0.85em; }
    .burndown-key span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 3px solid; }
    .burndown-key-plan::before { border-color: #999 !important; }
    .burndown-key-actual::before { border-color: #DA291C !important; }
    .burndown-ruler { display: block; overflow: visible; }
    /* The posts over the chart, a dot each (or one for several close together) at their time of day and latitude,
       read off the right-hand axis, in the dots' red. Their box (postsBox) opens beside them. */
    .burndown-marks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .burndown-mark { position: absolute; width: 0; height: 0; }
    .burndown-mark .live-post-pin, .burndown-mark .live-focus { left: 0; top: 0; }
    .burndown-mark:has(.live-focus) { z-index: 1; }  /* an open box over the other dots */
    .burndown-marks-axis { position: relative; min-width: 3em; font-size: 11px; font-variant-numeric: tabular-nums; color: #DA291C; }
    .burndown-marks-level { position: absolute; left: 0; transform: translateY(-50%); line-height: 1; }
    .burndown-key .burndown-key-marks::before { width: 6px; height: 6px; border: 1px solid #000 !important; border-radius: 50%; background: #DA291C; margin-right: 6px; }
    .burndown-axis { stroke: #888; }
    .burndown-axis-label { fill: var(--ink-1); font-size: 11px; }
    .burndown-levels { position: relative; min-width: 1.5em; font-size: 11px; font-variant-numeric: tabular-nums; }
    .burndown-level { position: absolute; right: 0; transform: translateY(-50%); line-height: 1; }
    .burndown-plot { position: relative; box-shadow: inset 0 0 0 1px #ccc; }
    .burndown-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .burndown-grid { stroke: #eee; stroke-width: 1px; vector-effect: non-scaling-stroke; }
    .burndown-plan { fill: none; stroke: #999; stroke-width: 2px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .burndown-actual { fill: none; stroke: #DA291C; stroke-width: 3px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .burndown-now { stroke: #000; stroke-width: 1px; vector-effect: non-scaling-stroke; }

    /* Stats: a grid filling the screen */
    .tab-stats { overflow: auto; }
    /* Phones: the cells one under another, as tall as they need, the page scrolling. Wider: Status and Conditions
       side by side, as tall as they need, and the Plan full width under them; on a wide screen it fills the rest of
       the screen, scrolling within. */
    .stats-grid { box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; }
    @media (min-width: 34rem) {
      .stats-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
    }
    @media (min-width: 60rem) {
      .stats-grid { height: 100%; grid-template-rows: auto minmax(0, 1fr); }
    }
    /* Rules drawn by each cell, so a part-filled last row stays white. */
    .stats-cell { padding: 12px 16px; overflow: auto; box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); }
    .stats-cell h2 { margin: 0 0 6px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-1); }
    /* Conditions: the solar time and weather, the sky, the sun's times, one under another. */
    .stats-cell .live-weather, .stats-cell .live-sky { margin: 0 0 12px; }
    .stats-cell .live-sky ul { max-width: 24rem; }
    .stats-cell .live-sun { margin: 0; }
    /* The plan: a full-width row of the grid, scrolling inside. Styled like
       the simulator's printed schedule (.print-schedule, css/style.css). */
    .stats-cell-plan { grid-column: 1 / -1; }
    .plan-schedule { width: 100%; border-collapse: collapse; font-size: 0.85em; line-height: 1.3; }
    .plan-schedule th { text-align: left; border-bottom: 1px solid var(--ink-1); position: sticky; top: -12px; background: #fff; }
    .plan-schedule th, .plan-schedule td { padding: 2px 10px 2px 0; }
    .plan-schedule tbody tr:nth-child(even) { background: #eee; }
    .plan-time { font-variant-numeric: tabular-nums; }
    .plan-diff { white-space: nowrap; }
    .plan-ahead { color: #1a7f37; font-weight: bold; }
    .plan-behind { color: #b42318; font-weight: bold; }

    /* The overview (plain /live) */
    .live { max-width: var(--measure); margin: 0 auto; padding: 1rem 16px 2rem; }
    .live-status { margin: 0.25rem 0 0; min-height: 1.6em; }
    .live-visits { margin: 0 0 1rem; min-height: 1.6em; }
    /* The radio (src/Radio.elm), at the header's right. */
    .radio { position: relative; z-index: 2; font-size: 0.85em; max-width: calc(100vw - 32px); }
    .radio-bar { display: flex; align-items: center; gap: 8px; background: #111; color: #fff; border-radius: 999px; padding: 4px 6px 4px 4px; }
    .radio button { font: inherit; border: 0; cursor: pointer; }
    .radio-play { flex: none; width: 2rem; height: 2rem; border-radius: 50%; background: #FFD100; color: #111; font-size: 0.85rem; line-height: 1; }
    .radio-info { display: flex; flex-direction: column; line-height: 1.15; min-width: 4.5rem; max-width: 11rem; }
    .radio-name { font-weight: bold; }
    .radio-status { opacity: 0.8; font-size: 0.9em; overflow-wrap: anywhere; }
    /* What's on: a line each, cut short (the whole of it is the info's title). */
    .radio-name, .radio-artist, .radio-album { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* While it plays: the album, and how far into the track. */
    .radio-album { opacity: 0.65; font-size: 0.85em; }
    .radio-progress { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 0.8em; opacity: 0.85; }
    .radio-progress-bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.25); overflow: hidden; }
    .radio-progress-fill { display: block; height: 100%; background: #FFD100; }
    .radio-times { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .radio-bar .radio-problem { color: #ffb3a7; opacity: 1; }
    .radio-volume { width: 5rem; accent-color: #FFD100; }
    .radio-links-button { background: none; color: #fff; text-decoration: underline; padding: 4px 6px; }
    .radio button:focus-visible, .radio input:focus-visible, .radio a:focus-visible { outline: 2px solid #FFD100; outline-offset: 2px; }
    .radio-links { position: absolute; right: 0; top: calc(100% + 6px); width: min(20rem, calc(100vw - 32px)); box-sizing: border-box; margin: 0;
      background: #fff; color: #111; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15); }
    .radio-links dt { font-weight: bold; margin-top: 6px; }
    .radio-links dt:first-child { margin-top: 0; }
    .radio-links dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    .live-weather { margin: 0 0 1rem; }
    .live-weather-when { opacity: 0.7; }
    /* The sky tiles (src/Live.elm, viewSky): a row of five; on the
       overview on a wide screen, a column pinned to the bottom-left corner. */
    .live-sky { margin: 0 0 1rem; }
    .live-sky ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
    .live-sky li { font-size: 0.75em; line-height: 1.25; text-align: center; }
    .live-sky-swatch { display: block; aspect-ratio: 1; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); margin-bottom: 0.25rem; }
    @media (min-width: 64rem) {
      .page-overview .live-sky { position: fixed; left: 16px; bottom: 16px; width: 3.5rem; margin: 0; z-index: 1; }
      .page-overview .live-sky ul { grid-template-columns: 1fr; }
    }
    .live-sun { margin: 1rem auto 0; border-collapse: collapse; font-size: 0.9em; }
    .live-sun caption { text-align: left; font-weight: bold; padding-bottom: 0.25rem; }
    .live-sun th, .live-sun td { text-align: left; padding: 0.15rem 0.75rem 0.15rem 0; font-variant-numeric: tabular-nums; }
    .live-sun thead th { font-weight: normal; opacity: 0.7; }
    .live-sun tbody th { font-weight: normal; }
    /* The stretched map (viewMap in Live.elm): the frame's padding leaves room for Manhattan to spill past the
       McDonald's and for the start flag above the northernmost one; past the padding it's cut off. */
    .live-map-frame { box-sizing: border-box; height: 560px; max-width: 360px; margin: 0 auto; padding: 40px 12px 12px; overflow: hidden; }
    .live-map-box { position: relative; height: 100%; }
    .live-map-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    div.live-map-layer { pointer-events: none; }
    /* The map (src/Live.elm, viewMap), bottom to top. */
    /* Sizes are screen pixels however the map stretches: lines don't scale, and the dots and the last position
       are the end caps of zero-length strokes (dotPath in Live.elm). */
    .live-borough { fill: #d9d9d9; }
    .live-network { fill: none; stroke: #fff; stroke-width: 0.5px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-planned-casing { fill: none; stroke: #000; stroke-width: 6px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-planned { fill: none; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-track { fill: none; stroke: #DA291C; stroke-width: 2.5px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    /* A black dot 1px wider all round, drawn under the planned route, then a white dot over it, then the colour. */
    .live-store-casing { fill: none; stroke: #000; stroke-width: 16px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-store { fill: none; stroke: #fff; stroke-width: 14px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-pip { fill: none; stroke: #FFD100; stroke-width: 8px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .live-pip-visited { stroke: #DA291C; }
    .live-pip-closed { stroke: #9C7C00; }
    .live-store-hit { fill: none; stroke: transparent; stroke-width: 24px; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
    /* A focused store's box, beside its dot (viewFocus in Live.elm). */
    .live-focus { position: absolute; transform: translate(14px, -50%); display: flex; flex-direction: column; padding: 4px 8px; background: #fff;
      border: 2px solid #000; font-size: 13px; line-height: 1.3; white-space: nowrap; pointer-events: none; }
    .live-focus-left { transform: translate(calc(-100% - 14px), -50%); }
    /* Posts on the map (viewPostPin): small solid red dots, centred on
       their spot, with a thin black outline;
       smaller than a McDonald's, so they don't compete with it. */
    .live-post-pin { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
      width: 6px; height: 6px; padding: 0; box-sizing: content-box; background: #DA291C; border: 1px solid #000; border-radius: 50%; }
    /* A bigger, invisible target, for fingers. */
    .live-post-pin::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
    .live-post-pin-open { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #000; }
    .live-post-pin:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
    /* A spot's posts, beside its pin: taller than a store's box, so it
       scrolls, and takes presses (video controls) rather than passing them on. */
    .live-focus-posts { pointer-events: auto; white-space: normal; width: 240px; max-width: calc(100vw - 80px); max-height: min(60vh, 26rem);
      overflow-y: auto; gap: 10px; padding: 8px; transform: translate(14px, -50%); cursor: auto; }
    .live-focus-posts.live-focus-left { transform: translate(calc(-100% - 14px), -50%); }
    .live-focus-posts.live-focus-below { transform: translate(14px, -12px); }
    .live-focus-posts.live-focus-left.live-focus-below { transform: translate(calc(-100% - 14px), -12px); }
    .live-focus-posts.live-focus-above { transform: translate(14px, calc(-100% + 12px)); }
    .live-focus-posts.live-focus-left.live-focus-above { transform: translate(calc(-100% - 14px), calc(-100% + 12px)); }
    /* On a phone there's no room beside a pin: a sheet along the screen's
       bottom instead. */
    @media (max-width: 40rem) {
      .live-focus-posts, .live-focus-posts.live-focus-left, .live-focus-posts.live-focus-below, .live-focus-posts.live-focus-above,
      .live-focus-posts.live-focus-left.live-focus-below, .live-focus-posts.live-focus-left.live-focus-above {
        position: fixed; left: 16px !important; right: 16px; top: auto !important; bottom: 16px; width: auto; max-width: none;
        max-height: 55vh; transform: none; z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
      .live-focus-post .live-post-photo img, .live-focus-post .live-post-video { max-height: 38vh; }
    }
    .live-focus-post { display: flex; flex-direction: column; gap: 3px; }
    .live-focus-close { position: sticky; top: 0; align-self: flex-end; margin: -4px -4px -34px 0; z-index: 1; width: 28px; height: 28px; padding: 0;
      border: 2px solid #000; border-radius: 50%; background: #fff; color: #000; font: bold 18px/1 -apple-system, Helvetica, Arial, sans-serif; cursor: pointer; flex: none; }
    .live-focus-post .live-post-photo img, .live-focus-post .live-post-video { max-height: 40vh; border-radius: 3px; }
    .live-focus-when { font-size: 12px; opacity: 0.7; }
    .live-me-edge { fill: none; stroke: #fff; stroke-width: 7px; stroke-linecap: square; vector-effect: non-scaling-stroke; }
    .live-me { fill: none; stroke: #DA291C; stroke-width: 4px; stroke-linecap: square; vector-effect: non-scaling-stroke; }
    /* The flags: pinned pictures (viewFlag), drawn in their own units. */
    .live-flag-pin { position: absolute; }
    .live-flag { position: absolute; overflow: visible; }
    .live-flag-outline { fill: none; stroke: #000; stroke-width: 70px; stroke-linejoin: round; }
    .live-flag-start { fill: #1E9E3E; }
    .live-flag-finish { fill: #fff; }
    .live-flag-check { fill: #000; }
    .live-note { text-align: center; }
    .live-posts { list-style: none; padding: 0; margin: 1.5rem auto 0; max-width: 28rem; }
    .live-post { border-top: 1px solid var(--rule); padding: 0.6rem 0; }
    .live-post-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .live-post-when { margin: 0.2rem 0 0; font-size: 0.85em; opacity: 0.7; }
    /* body is a flex column (css/style.css), and a flex item won't shrink
       below its content's natural width: a 720 px video would widen the
       page past the screen. */
    main { min-width: 0; }
    .live-post-photo img, .live-post-video { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #000; border-radius: 6px; }
    .live-post-voice { width: 100%; }
    /* Guests' likes and comments under a post (src/Guests.elm). */
    .guest { margin-top: 0.4rem; font-size: 0.9em; }
    .guest-bar { display: flex; gap: 1rem; align-items: center; }
    .guest button { font: inherit; cursor: pointer; }
    .guest-like { border: 0; background: none; padding: 0; color: inherit; text-decoration: none; font-size: 1.05em; }
    .guest-liked { color: #DA291C; }
    .guest-link { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; }
    .guest-comments { list-style: none; padding: 0; margin: 0.4rem 0 0; }
    .guest-comment { margin: 0.25rem 0; overflow-wrap: anywhere; }
    .guest-comment strong a { color: inherit; }
    .guest-comment > .guest-link { margin-left: 0.5rem; }
    .guest-pending { opacity: 0.65; }
    .guest-meta { font-size: 0.85em; opacity: 0.7; }
    .guest-composer textarea { width: 100%; min-height: 4rem; font: inherit; padding: 6px; border: 2px solid #000; box-sizing: border-box; margin-top: 0.4rem; }
    .guest-composer-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .guest-composer button[type=submit], .guest-report button[type=submit] { border: 0; background: #000; color: #fff; font-weight: 700; padding: 6px 14px; }
    .guest-report { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.3rem; flex-wrap: wrap; }
    .guest-report input { flex: 1; min-width: 10rem; font: inherit; padding: 4px 6px; border: 2px solid #000; }
    .guest-note { margin: 0.3rem 0 0; font-size: 0.85em; }

    @media (min-width: 48rem) {
      .live-posts .live-post-pair { position: relative; left: 50%; width: min(44rem, calc(100vw - 32px)); transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <!-- Elm draws the page here (src/Live.elm). Its own element, not the
       whole body: extensions add things to <body>, which would crash an
       Elm program that owned it. -->
  <div id="app"></div>
  <noscript>
    <p><a href="/">McTrot</a></p>
    <h1>McTROT 5</h1>
    <p>This page shows where I am during a McTrot attempt. It requires JavaScript.</p>
  </noscript>

  <script src="/js/pair-player.js?v=08a817679d"></script>
  <script src="/js/live.js?v=21f75a290a"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    // ?api=http://localhost:3000 points the page at a local recorder.
    var api = params.get("api");

    // --- The radio (src/Radio.elm draws it; this plays it) ---------------
    var audio = new Audio();
    audio.preload = "none";
    // iPhones and iPads ignore a page setting the volume.
    audio.volume = 0.5;
    var volumeAdjustable = audio.volume === 0.5;
    audio.volume = 1;

    var app = Elm.Live.init({
      node: document.getElementById("app"),
      flags: {
        path: location.pathname,
        origin: location.origin,
        hash: location.hash,
        api: /^https?:\/\//.test(api || "") ? api.replace(/\/+$/, "") : "https://api.mctrot.nyc",
        radio: { volumeAdjustable: volumeAdjustable }
      }
    });

    // Back from signing in to like or comment (#like=…): Elm has it now,
    // so take it off the address and a reload doesn't do it again.
    if (/^#(like|comment)=/.test(location.hash)) {
      history.replaceState(null, "", location.pathname + location.search);
    }

    // --- The address (src/Live.elm's navigate, setTitle, pathChanged) -----
    // ?api=… stays on the address as views change, for local testing.
    app.ports.navigate.subscribe(function (page) {
      history.pushState(null, "", page.path + location.search);
      document.title = page.title;
      window.scrollTo(0, 0);
    });
    app.ports.setTitle.subscribe(function (title) { document.title = title; });
    window.addEventListener("popstate", function () { app.ports.pathChanged.send(location.pathname); });

    var send = function (event) { app.ports.radioIn.send(event); };
    var stopping = false;
    // Browsers give the same error for a stream they can't reach and one
    // they can't play, so a failed start asks the address directly: no
    // answer at all means unreachable. (The answer itself can't be read
    // from another site, but that it came is enough.)
    var problem = function (url) {
      var e = audio.error;
      if (e && e.code === 3) return Promise.resolve("The stream broke off.");
      var stop = new AbortController();
      setTimeout(function () { stop.abort(); }, 8000);
      return fetch(url, { mode: "no-cors", signal: stop.signal })
        .then(function () { stop.abort(); return "That isn’t audio this browser can play (a playlist?)."; })
        .catch(function () { return "Can’t reach the stream."; });
    };
    var fail = function () {
      var url = audio.getAttribute("src");
      if (!url) return;
      problem(url).then(function (message) {
        // Only if that's still the station playing.
        if (!stopping && audio.getAttribute("src") === url) send({ event: "error", message: message });
      });
    };
    audio.addEventListener("playing", function () { send({ event: "playing" }); });
    audio.addEventListener("waiting", function () { send({ event: "waiting" }); });
    audio.addEventListener("pause", function () { if (!stopping) send({ event: "paused" }); });
    audio.addEventListener("ended", function () { send({ event: "ended" }); });
    audio.addEventListener("error", function () { if (!stopping) fail(); });
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Radio", artist: "McTrot" });
    }

    app.ports.radioOut.subscribe(function (cmd) {
      if (cmd.command === "play") {
        stopping = false;
        audio.src = cmd.url;
        audio.volume = cmd.volume;
        audio.play().catch(function (err) {
          if (err.name === "NotAllowedError") send({ event: "error", message: "The browser wants a tap on ▶ first." });
          else if (err.name !== "AbortError" && !audio.error) fail();
        });
      } else if (cmd.command === "stop") {
        // Drop the connection, so playing again joins the stream live
        // rather than resuming from a buffer.
        stopping = true;
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
      } else if (cmd.command === "volume") {
        audio.volume = cmd.volume;
      } else if (cmd.command === "nowPlaying") {
        if ("mediaSession" in navigator && window.MediaMetadata) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: cmd.title, artist: cmd.artist, album: cmd.album });
        }
      }
    });
  </script>
</body>
</html>
