<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator — McTrot</title>
  <meta name="description" content="A simulated annealing search for a McTrot route, run in the browser.">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FFD100">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Simulator — McTrot">
  <meta property="og:description" content="A simulated annealing search for a McTrot route.">
  <meta property="og:image" content="https://mctrot.nyc/og-image.png">
  <meta property="og:url" content="https://mctrot.nyc/simulator.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mctrot.nyc/og-image.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mctrot-map.css">
</head>
<body class="sim-page">
  <main id="main">
    <div id="simulator">
      <noscript>
        <p><a href="/">McTrot</a></p>
        <h1>Simulator</h1>
        <p>The simulator requires JavaScript.</p>
      </noscript>
    </div>
  </main>

  <script src="js/simulator.js"></script>
  <script>
    // Default start: the next Nov 21, today or later, by the visitor's local
    // date (not toISOString(), which is UTC and can be off by a day).
    var now = new Date();
    var year = now.getFullYear();
    if (now.getMonth() > 10 || (now.getMonth() === 10 && now.getDate() > 21)) {
      year += 1;
    }
    var app = Elm.Simulator.init({
      node: document.getElementById("simulator"),
      flags: year + "-11-21"
    });
    app.ports.print.subscribe(function () {
      window.print();
    });

    // GPX export: on a touch device that can share files (iOS Safari, for
    // one), open the share sheet, which lists the installed apps that take
    // GPX (Gaia GPS, OsmAnd, Komoot, ...) along with Files and AirDrop.
    // Anywhere else, or if sharing fails, download the file instead.
    // Cancelling the share sheet does nothing.
    app.ports.saveGpx.subscribe(function (out) {
      var file = new File([out.gpx], out.filename, { type: "application/gpx+xml" });

      function download() {
        var url = URL.createObjectURL(file);
        var a = document.createElement("a");
        a.href = url;
        a.download = out.filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      }

      var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function (err) {
          if (err.name !== "AbortError") {
            download();
          }
        });
      } else {
        download();
      }
    });
  </script>
</body>
</html>
