<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>McTrot Simulator</title>
  <meta name="description" content="Searches for a McTrot route through every McDonald&rsquo;s in Manhattan, on foot, within their opening hours. Set the start time, pace, and stop length; print the result, export it as GPX, or share it as a link.">
  <link rel="canonical" href="https://mctrot.nyc/simulator.html">

  <!-- The site's icons, but the simulator's own share image and manifest
       (website/sim/; see scripts/render_simulator_previews.mjs). -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/sim/manifest.webmanifest">
  <meta name="theme-color" content="#FFD100">
  <meta name="application-name" content="McTrot Simulator">
  <meta name="apple-mobile-web-app-title" content="Simulator">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="McTrot">
  <meta property="og:title" content="McTrot Simulator">
  <meta property="og:description" content="Searches for a route through every McDonald&rsquo;s in Manhattan, on foot, within their opening hours.">
  <meta property="og:url" content="https://mctrot.nyc/simulator.html">
  <meta property="og:image" content="https://mctrot.nyc/sim/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A McTrot route, drawn in yellow with its stops circled, over a close-up of Manhattan&rsquo;s streets, beside the word Simulator.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="McTrot Simulator">
  <meta name="twitter:description" content="Searches for a route through every McDonald&rsquo;s in Manhattan, on foot, within their opening hours.">
  <meta name="twitter:image" content="https://mctrot.nyc/sim/og.png">
  <meta name="twitter:image:alt" content="A McTrot route, drawn in yellow with its stops circled, over a close-up of Manhattan&rsquo;s streets, beside the word Simulator.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "McTrot Simulator",
    "url": "https://mctrot.nyc/simulator.html",
    "description": "Searches for a McTrot route through every McDonald’s in Manhattan, on foot, within their opening hours.",
    "image": "https://mctrot.nyc/sim/og.png",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "isPartOf": { "@type": "WebSite", "name": "McTrot", "url": "https://mctrot.nyc/" }
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mctrot-map.css">
</head>
<body class="sim-page">
  <main id="main">
    <div id="simulator">
      <noscript>
        <p><a href="/">McTrot</a></p>
        <h1>McTrot Simulator</h1>
        <p>The simulator searches for a route through every McDonald&rsquo;s in Manhattan, on foot, within their opening hours, for a chosen start time, pace, and stop length.</p>
        <p>The simulator requires JavaScript.</p>
      </noscript>
    </div>
  </main>

  <script src="js/simulator.js"></script>
  <script>
    // Default start: the next Nov 21, today or later, by the visitor's local
    // date (not toISOString(), which is UTC and can be off by a day).
    var now = new Date();
    var year = now.getFullYear();
    if (now.getMonth() > 10 || (now.getMonth() === 10 && now.getDate() > 21)) {
      year += 1;
    }
    var app = Elm.Simulator.init({
      node: document.getElementById("simulator"),
      flags: {
        defaultStartDate: year + "-11-21",
        query: Array.from(new URLSearchParams(window.location.search))
      }
    });
    // iOS Safari applies :active (the keys' pressed look) only on pages
    // with a touchstart listener.
    document.addEventListener("touchstart", function () {}, { passive: true });

    app.ports.print.subscribe(function () {
      window.print();
    });

    // GPX export: a plain download, on every device.
    app.ports.saveGpx.subscribe(function (out) {
      var file = new File([out.gpx], out.filename, { type: "application/gpx+xml" });
      var url = URL.createObjectURL(file);
      var a = document.createElement("a");
      a.href = url;
      a.download = out.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    });

    // Starting a search from START drops a shared link's settings.
    app.ports.clearQuery.subscribe(function () {
      history.replaceState(null, "", window.location.pathname);
    });

    // SHARE: put the search's settings in the address bar (see Link.elm),
    // then open the share sheet on touch devices that have one (cancelling
    // it does nothing); otherwise, or if sharing fails, copy the link.
    app.ports.share.subscribe(function (query) {
      history.replaceState(null, "", query);
      var url = window.location.href;

      function copy() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(
            function () { app.ports.linkCopied.send(null); },
            function () { window.prompt("Copy this link:", url); }
          );
        } else {
          window.prompt("Copy this link:", url);
        }
      }

      var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      if (touch && navigator.share) {
        navigator.share({ title: document.title, url: url }).catch(function (err) {
          if (err.name !== "AbortError") {
            copy();
          }
        });
      } else {
        copy();
      }
    });
  </script>
</body>
</html>
