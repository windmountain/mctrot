# Who can decrypt recorder secrets. Edit with: sops secrets/recorder.yaml
# (from recorder/, inside `nix develop`).
keys:
  # Zach: the SSH key on the laptop (~/.ssh/id_ed25519); sops reads it
  # directly, no separate key file.
  - &zach ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO7Jgkt1Qinux6JxO4eh3pL+E5BRYrUM+XF2uE4h+xPK
  # The Droplet: its SSH host key, converted with ssh-to-age. Changes on
  # every reinstall; then update this and run
  #   sops updatekeys secrets/recorder.yaml
  - &recorder age1cs9vez7dmxluyaw7dr0523pr77p0s46rwmv3jm2gxd2rdpfr9a5sw9403d
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *zach
          - *recorder
