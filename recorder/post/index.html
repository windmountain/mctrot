<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>McTrot CTRL</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/post/manifest.webmanifest">
  <link rel="icon" href="/post/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/post/icons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/post/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CTRL">
  <meta name="theme-color" content="#FFD100">
  <style>
    :root {
      --bg: #FFD100; --ink: #0D0D08; --card: #fff; --muted: #6b6648;
      --ok: #1a7f37; --bad: #b42318;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      color-scheme: light;
    }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { max-width: 32rem; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 32px; }
    header { display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 1.4rem; margin: 0; flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .dot.online { background: var(--ok); }
    .dot.offline { background: var(--bad); }
    #summary { margin: 4px 0 12px; min-height: 1.3em; color: var(--muted); }
    [hidden] { display: none !important; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 12px 0; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px;
      padding: 14px 10px; background: var(--ink); color: #fff;
    }
    button.big { padding: 26px 8px; font-size: 1.15rem; }
    button.secondary { background: #eee6b8; color: var(--ink); }
    button:disabled { opacity: 0.35; }
    button:active:not(:disabled) { transform: scale(0.97); }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 7rem; font: inherit;
      border: 1px solid #d8d0a0; border-radius: 10px; padding: 10px;
    }
    input { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d8d0a0; border-radius: 10px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .row .grow { flex: 1; color: var(--muted); font-size: 0.9rem; }
    #flash { min-height: 1.3em; font-weight: 600; margin: 8px 0 0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 10px 0; border-top: 1px solid #eee; align-items: baseline; }
    li:first-child { border-top: 0; }
    li .what { flex: 1 1 9rem; overflow-wrap: anywhere; }
    li .when { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
    li .state { font-size: 0.85rem; white-space: nowrap; }
    li .state.sent { color: var(--ok); }
    li .state.failed { color: var(--bad); }
    li .actions button { padding: 4px 8px; font-size: 0.8rem; margin-left: 4px; }
    li .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; align-self: center; }
    li .thumb.icon { display: grid; place-items: center; background: #f4efd2; font-size: 1.3rem; }
    li .progress { height: 4px; background: #eee; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    li .progress > div { height: 100%; background: var(--ink); }
    .small { font-size: 0.9rem; color: var(--muted); }
    .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 4px; }
    li .actions { white-space: nowrap; margin-left: auto; }
    li .actions button.danger { color: var(--bad); }
    li.editing { background: #fffbe6; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>McTrot</h1>
      <span id="net" class="dot" title="Connection"></span>
    </header>
    <p id="summary"></p>

    <!-- Shown until signed in. -->
    <section id="signin" class="card" hidden>
      <p><strong>Sign in</strong></p>
      <button id="faceid" class="big" style="width:100%">Sign in with Face ID</button>
      <details id="token-box">
        <summary class="small">Use the ingest token instead</summary>
        <p class="small">The first time on a phone, sign in with the token, then add Face ID.</p>
        <input id="token" type="password" autocomplete="off" placeholder="Ingest token">
        <div class="row"><span class="grow"></span><button id="token-go">Sign in</button></div>
      </details>
      <p id="signin-error" class="small"></p>
    </section>

    <!-- Shown once signed in. -->
    <section id="app" hidden>
      <div class="buttons">
        <button id="visit" class="big">Check In</button>
        <button id="post" class="big">Post</button>
        <button id="upload" class="big">Upload</button>
      </div>
      <!-- Photos, videos, voice notes: on iPhone, the camera, Photos or Files. -->
      <input id="file" type="file" accept="image/*,video/*,audio/*" hidden>
      <p id="flash" aria-live="polite"></p>

      <div id="composer" class="card" hidden>
        <textarea id="text" maxlength="1000" placeholder="What's happening?"></textarea>
        <div class="row">
          <span id="count" class="grow">0 / 1000</span>
          <button id="cancel" class="secondary">Cancel</button>
          <button id="send">Post</button>
        </div>
      </div>

      <!-- What hasn't reached the server yet (or is being processed there). -->
      <div id="outbox-card" class="card" hidden>
        <h2>Outbox</h2>
        <ul id="outbox"></ul>
      </div>

      <!-- Guests' comments to approve (post/comments.js); hidden when guests are off. -->
      <div id="comments-card" class="card" hidden>
        <h2>Comments <span id="comments-count"></span></h2>
        <ul id="comments"></ul>
      </div>

      <!-- What the server has: delete anything, edit text posts. -->
      <div class="card">
        <h2>Sent</h2>
        <p id="sent-note" class="small" hidden></p>
        <ul id="sent"></ul>
        <p id="sent-empty" class="small" hidden>Nothing sent yet.</p>
      </div>

      <p class="small">
        <a href="#" id="add-passkey">Add Face ID to this phone</a> ·
        <a href="#" id="signout">Sign out</a>
      </p>
    </section>
  </main>

  <script src="/post/webauthn.js"></script>
  <script src="/post/tus.js"></script>
  <script src="/post/app.js" type="module"></script>
  <script src="/post/comments.js" type="module"></script>
</body>
</html>
